name: CI

on:
  push:
    branches: [ main, mz/core ]
  pull_request:
    branches: [ main, mz/core ]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Set up Rust
        # Installs the toolchain pinned in negpy_core/rust-toolchain.toml.
        working-directory: negpy_core
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: negpy_core

      - name: Rust licenses and bans (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: negpy_core/Cargo.toml

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libgl1

      - name: Install Dependencies
        # pieusb / plustek are pure Python (+ bundled libusb where needed); without
        # them those backend tests importorskip away.
        run: uv sync --group dev --group plustek --group pieusb

      - name: Rust checks (fmt, clippy, test)
        # Under uv run, PyO3's build script finds the project's Python 3.13, not the runner's.
        run: uv run --no-sync make rust

      - name: Run Linting (Ruff)
        run: uv run ruff check .

      - name: Run Type Checking (ty)
        run: |
          uv run ty check \
            --exclude "tests/" --exclude "docs/" --exclude "build/" --exclude "dist/" --exclude ".venv/" \
            --ignore "no-matching-overload" \
            --ignore "unresolved-attribute" \
            --ignore "invalid-method-override" \
            --ignore "not-iterable" \
            --ignore "unsupported-operator" \
            --ignore "invalid-argument-type" \
            --ignore "unused-type-ignore-comment" \
            --ignore "unresolved-import" \
            --ignore "unsupported-bool-conversion" \
            --ignore "invalid-assignment" \
            --ignore "invalid-parameter-default" \
            --ignore "call-non-callable"

      - name: Run Tests
        run: uv run pytest tests/ --cov=negpy --cov-report=term-missing --cov-report=xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  native:
    # negpy_core must give the same bits on every release platform: run the Rust tests and
    # the pytest oracles of the ported functions on each one.
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Set up Rust
        working-directory: negpy_core
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: negpy_core

      - name: Rust tests
        working-directory: negpy_core
        run: cargo test

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libgl1

      - name: Configure LLVM for llvmlite (macOS x86_64)
        # llvmlite has no Intel macOS wheel, so it builds from source against LLVM 20.
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          brew install llvm@20
          LLVM20="$(brew --prefix llvm@20)"
          echo "PATH=/usr/local/bin:${LLVM20}/bin:${PATH}" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=${LLVM20}/bin/llvm-config" >> "$GITHUB_ENV"
          echo "CMAKE_ARGS=-DLLVM_DIR=${LLVM20}/lib/cmake/llvm -DCMAKE_PREFIX_PATH=${LLVM20}" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: uv sync --group dev

      - name: Ported-function oracles
        run: uv run pytest tests/test_percentiles.py
